<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Gold gradient for right half -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F0D4A0"/>
      <stop offset="50%"  stop-color="#D4A373"/>
      <stop offset="100%" stop-color="#8C5E2A"/>
    </linearGradient>
    <!-- Clip right triangle -->
    <clipPath id="rightHalf">
      <polygon points="50,8 92,50 50,92"/>
    </clipPath>
    <!-- Clip left triangle -->
    <clipPath id="leftHalf">
      <polygon points="8,50 50,8 50,92"/>
    </clipPath>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App icon background: dark navy rounded square -->
  <rect width="100" height="100" rx="20" fill="#0C1428"/>

  <!-- Left diamond half: medium navy (slightly lighter so diamond reads against bg) -->
  <polygon points="8,50 50,8 50,92" fill="#1A2B44"/>

  <!-- Right diamond half: gold gradient -->
  <polygon points="50,8 92,50 50,92" fill="url(#goldGrad)"/>

  <!-- ── Perspective grid in right half ── -->
  <!-- Lines radiate from right vertex (92,50) to equally-spaced points on left edge (x=50) -->
  <!-- Cross-lines at each y level (computed: upper right edge x=40+y, lower right edge x=140-y) -->
  <g clip-path="url(#rightHalf)" fill="none" stroke="#FFF5E0" stroke-linecap="round" stroke-width="0.7" opacity="0.7">
    <!-- Radial lines (vanishing point → left edge) -->
    <line x1="92" y1="50" x2="50" y2="17"/>
    <line x1="92" y1="50" x2="50" y2="25"/>
    <line x1="92" y1="50" x2="50" y2="33"/>
    <line x1="92" y1="50" x2="50" y2="41"/>
    <line x1="92" y1="50" x2="50" y2="59"/>
    <line x1="92" y1="50" x2="50" y2="67"/>
    <line x1="92" y1="50" x2="50" y2="75"/>
    <line x1="92" y1="50" x2="50" y2="83"/>
    <!-- Horizontal cross lines -->
    <!-- Upper-right edge: x = (92-50)/(50-8)*(y-8)+50 = (y-8)+50 = y+42 ... wait let me recalc -->
    <!-- Right triangle: (50,8)→(92,50)→(50,92)                              -->
    <!-- Upper-right edge from (50,8) to (92,50): at y in [8,50], x = 50+(y-8) = 42+y -->
    <!-- Lower-right edge from (92,50) to (50,92): at y in [50,92], x = 92-(y-50) = 142-y -->
    <line x1="50" y1="17" x2="59" y2="17"/>   <!-- 42+17=59 -->
    <line x1="50" y1="25" x2="67" y2="25"/>   <!-- 42+25=67 -->
    <line x1="50" y1="33" x2="75" y2="33"/>   <!-- 42+33=75 -->
    <line x1="50" y1="41" x2="83" y2="41"/>   <!-- 42+41=83 -->
    <line x1="50" y1="59" x2="83" y2="59"/>   <!-- 142-59=83 -->
    <line x1="50" y1="67" x2="75" y2="67"/>   <!-- 142-67=75 -->
    <line x1="50" y1="75" x2="67" y2="75"/>   <!-- 142-75=67 -->
    <line x1="50" y1="83" x2="59" y2="83"/>   <!-- 142-83=59 -->
  </g>

  <!-- ── Fork icon in left half ── -->
  <!-- Fork centered around x=38, y=50 (visual center of left triangle) -->
  <g clip-path="url(#leftHalf)" fill="white">
    <!-- 3 tines from y=29 to y=43 -->
    <rect x="30"   y="29" width="3" height="14" rx="1.5"/>
    <rect x="35.5" y="29" width="3" height="14" rx="1.5"/>
    <rect x="41"   y="29" width="3" height="14" rx="1.5"/>
    <!-- Neck: curved shoulder joining tines to handle -->
    <!-- Left shoulder curve -->
    <path d="M30,43 L30,47 Q30,53 35.5,53" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Right shoulder curve -->
    <path d="M44,43 L44,47 Q44,53 38.5,53" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Handle -->
    <rect x="36" y="53" width="3" height="19" rx="1.5"/>
  </g>

  <!-- Diamond outer border: subtle gold -->
  <polygon points="8,50 50,8 92,50 50,92" fill="none" stroke="#D4A373" stroke-width="1.2" opacity="0.5"/>

  <!-- Center dividing line (very subtle) -->
  <line x1="50" y1="8" x2="50" y2="92" stroke="#000" stroke-width="0.5" opacity="0.2"/>
</svg>
